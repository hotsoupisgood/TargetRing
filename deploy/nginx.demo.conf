# targetring — two-tier nginx config (config only; not started by anything here)
#
# Design: docs/TABLED-PUBLIC-DEMO-2026-10-09.md.
# Prerequisite 3 ("nginx basic auth") for that design. This file does not
# deploy anything by itself — see deploy/README.md for the steps, and note
# that AGENTS.md rule 10 ("nothing public") is still unamended: this config
# is prepared, not authorised to run on a public interface.
#
# Shape:
#   - public tier  (this server block, no auth) -> targetring running with
#     TARGETRING_DEMO=1, upstream on 127.0.0.1:8900. Read-only: lists and
#     serves only the runs in TARGETRING_DEMO_RUNS; the app itself (not
#     nginx) refuses /api/analyse, /api/autopick, /api/region-for and any
#     run id outside the allowlist (app._demo_gate).
#   - full-functionality tier (second server block / location, basic auth)
#     -> targetring running WITHOUT TARGETRING_DEMO, upstream on
#     127.0.0.1:8901. This is the box owner's own use, password-walled
#     because the app itself has no login surface (by design — see the
#     tabled doc's "why" section).
#
# Two separate app processes, two separate ports. The demo process must be
# started with no ANTHROPIC_API_KEY in its environment (AGENTS.md: "A demo
# box never holds an API key"). Running both tiers from one process would
# make that guarantee depend on a flag instead of on the key simply not
# being there for that process.

# -- shared: basic auth credential file, generated manually, never committed --
# See deploy/README.md step 3. This file is referenced, not provided:
#   /etc/nginx/targetring.htpasswd

# -- public demo tier: no auth, serves TARGETRING_DEMO=1 upstream --
server {
    listen 80;
    server_name demo.example.invalid;  # replace with the real demo hostname

    access_log /var/log/nginx/targetring-demo.access.log;
    error_log  /var/log/nginx/targetring-demo.error.log;

    # Demo app process: TARGETRING_DEMO=1, TARGETRING_DEMO_RUNS set, no API key.
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Belt-and-suspenders: the app's own _demo_gate already 403s these,
        # but a box with no TARGETRING_DEMO=1 somehow set on this process
        # should still never reach them from the public tier.
        limit_except GET HEAD { deny all; }
    }

    location = /api/analyse        { return 403; }
    location = /api/autopick       { return 403; }
    location = /api/region-for     { return 403; }
    location ^~ /api/analyse/progress/ { return 403; }
}

# -- full-functionality tier: basic auth, serves the normal (non-demo) upstream --
server {
    listen 80;
    server_name full.example.invalid;  # replace with the real hostname

    access_log /var/log/nginx/targetring-full.access.log;
    error_log  /var/log/nginx/targetring-full.error.log;

    auth_basic           "targetring";
    auth_basic_user_file /etc/nginx/targetring.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# If TLS is wanted, terminate it the usual way (certbot --nginx against each
# server_name) after this config is in place and working over plain HTTP on
# the box's internal network. Not included here: it needs real hostnames and
# a certificate authority to actually run, which is a deploy action, not
# config authoring.
